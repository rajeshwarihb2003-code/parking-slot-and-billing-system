<!DOCTYPE html>
<html lang="en"
<head>
    <link rel="stylesheet" href="{{url_for('static',filename='style.css')}}">
    <title>Parking Billing system</title>
</head>
<body>
    <header>
    <h1>Parking Billing System</h1>
    </header>
    <div class="container">
        <div class="welcome">
    <h2>Welcome!</h2>
    <p>Manage parking slots,vehicle entry,vehicle exit and billing.</p>
    </div>
    <div class="stats">
        <div class="card">
            <h3>Total Slots</h3>
            <p>50</p>
        </div>
        <div class="card">
            <h3>Available</h3>
            <p>35</p>
        </div>
        <div class="card">
            <h3>Occupied</h3>
            <p>15</p>
        </div>
    </div>
    <div class="button">
    <a href="/vehicle-entry" class="btn">Vehicle Entry</a>
    <button class="btn">Vehicle Exit</button>
    </div>
</div>
</body>
</html>
